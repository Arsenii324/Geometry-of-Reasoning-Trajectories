[project]
name = "traj-geom"
version = "0.1.0"
description = "Inference-only study of latent reasoning trajectories in the Huginn-3.5B recurrent-depth transformer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
model = [
    "torch",
    "transformers==4.53.3",
    "accelerate",
    "datasets",
]
tda = [
    "ripser",
    "persim",
    "scipy",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traj_geom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
# Lint what the project maintains. Each exclusion has a concrete reason; none of
# them is "the number was large".
#   notebooks         proven exploratory scratch (semicolons, throwaway vars).
#   scratch/kaggle_*  FROZEN kernel bundles — the committed record of what actually
#                     ran on Kaggle (.gitignore's 2026-07-28 exception). Editing one
#                     breaks its correspondence with the results it produced. They
#                     also cannot lint clean by construction: every `body.py` is a
#                     FRAGMENT whose shared blocks are inlined by build_kernel.py, so
#                     `run`/`batched_generate`/`cv_r2` read as F821 undefined-name.
#                     `scratch/_lib/` is deliberately NOT excluded — it is the
#                     maintained source of those blocks and carries its own tests.
#   h3_toy_model      superseded toy-model codebase, kept as the evidence behind
#                     claims_ledger row A6; its tests are still collected by pytest.
# Audited before excluding (2026-08-07): all 18 B023 function-uses-loop-variable in
# scratch/ are FALSE POSITIVES — every closure is consumed inside the iteration that
# built it (kaggle_jacobian's eigs() call at main.py:136; the `cap` forward hooks,
# removed in `finally`). No real defect is silenced here; D31/D55 are unaffected.
extend-exclude = ["notebooks", "scratch/kaggle_*", "h3_toy_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "W"]

[tool.pytest.ini_options]
# h3_toy_model carries the A6 H3 toy-model finding cited in claims_ledger.md;
# its 5 tests passed but were never collected here until 2026-07-25 (rigor_audit §14).
testpaths = ["tests", "h3_toy_model"]
addopts = "-ra"
