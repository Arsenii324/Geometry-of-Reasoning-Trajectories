name: steerregime-does-the-prose-direction-move-the-rotation-regime
desc: >
  A51: additive to A48, and it connects the steering work to the geometry line. The vector A48
  adds to e is the same object the regime line manipulates -- D140 interpolates e between nouns
  to flip settling and rotating, D161 does it from the wte row, D173 swaps e mid-trajectory with
  62 of 64 switches taking at P1 = 0.000e+00. So e-space already contains one known, causally
  verified, behaviourally measurable direction. A48 cannot test the relation because its base
  prompts are census items and the regime is defined on D132's template, so this runs the same
  steering vector on prompts sitting on both sides of the boundary: D134's rotating set symbol,
  symptom and cymbal, and its settling set element, token and digit. Both branches of the fork
  are worth having. If R stays on whichever side of the 0.6677 threshold the base prompt started,
  formatting and regime are independent directions in e-space, which bounds what "the embedding
  controls the regime" means. If R crosses as alpha grows, the prose frame and the period-6
  rotation are the same phenomenon seen two ways, which ties the format findings directly to the
  geometry. P4 is the arm that decides whether either reading is licensed: D144 found a
  norm-matched random bearing in e-space destroys rotation on 3 of 3 carriers, so without a
  random control at matched norm, "steering changed R" cannot be distinguished from "any large
  e perturbation changes R". rotation_power is imported from traj_geom and never reimplemented,
  because D137's instrument null rests on the kernel-side and analysis-side values being the
  same function. Mounts the prebuilt weights dataset.
cmd: python job.py ${RESULT} ${HUGINN}
datasets:
  - bt102r0j5cb8r6r6nb36: HUGINN
outputs:
  - steerregime.json: RESULT
env:
  python:
    type: manual
    version: "3.11"
cloud-instance-type: gt4.1
