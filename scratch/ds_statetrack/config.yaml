name: statetrack-the-one-axis-recurrence-must-need
desc: >
  A27: state tracking, the difficulty axis DR1 argues genuine recurrence is REQUIRED for.
  Every ladder this project has run is shortcuttable in principle -- addk (difficulty
  collinear with the answer), fixedsum (VOID at 0% above one nonzero digit, D118),
  binary_search (depth ran OPPOSITE to difficulty, D128), nth_item_k (structurally clean,
  H2 null once list position 1 is removed, D143). Merrill/Petty/Sabharwal show
  transformers cannot express computation outside TC0 and cannot solve permutation
  composition; the A5 word problem is NC1-complete. So sequential state tracking is the
  one place H2 gets a fair trial, and it has never been run here. HONEST SCOPE: S3 is
  SOLVABLE, so the NC1 guarantee does NOT apply to this task -- it is state tracking, not
  an NC1-complete problem, and the docstring says so before the result so no later row
  claims otherwise. A5 would carry the guarantee and would certainly read 0%. Design: 8
  swaps always, so token count is constant by construction; difficulty m = how many swaps
  actually move the ball, enacted and orthogonal to length; answer is one of three cup
  labels, single token, chance 1/3. This is a capability SCREEN first (DR1 Stage 1,
  D130's lesson): geometry is read only if 3-way accuracy at m=1 beats the MAJORITY-CLASS
  baseline at binomial p<0.05. Golds are balanced within each level, because the first
  draft's A:31/C:35/B:21 split let a constant "C" score 40% and pass a chance-floor gate
  on no ability at all. Two prompt formats, since format alone has moved this project's
  capability axis by up to 85 points.
cmd: python job.py ${RESULT}
outputs:
  - statetrack.json: RESULT
env:
  python:
    type: manual
    version: "3.11"
cloud-instance-type: gt4.1
