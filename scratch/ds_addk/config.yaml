name: addk-powered-h2
desc: >
  B4: the powered, pre-registered retest of the project's only positive H2
  direction. D101 found best_depth rising with difficulty but its p-values were
  pseudoreplicated ~12x; at the correct unit nothing cleared correction. This
  narrows to ONE family (addk -- the ladder D107 showed survives honest
  fixed-depth scoring, 41.7% -> 38.1%, while nth_item_k collapses to 4.2%), ONE
  statistic, ~6x the draws, the (level,item) unit enforced by rigor.require_units,
  a within-level permutation null, and an in-kernel token-count gate that reports
  VOID rather than a confounded correlation.
cmd: python job.py ${RESULT}
outputs:
  - grid.json: RESULT
env:
  python:
    type: manual
    version: "3.11"
cloud-instance-type: gt4.1
